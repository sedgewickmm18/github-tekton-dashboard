[project]
name = "tekton-scraper"
version = "0.1.0"
description = "Tekton Pipeline Dashboard scraper"
readme = "README.md"
authors = [
    { name = "Markus Müller", email = "sedgewickmm18@googlemail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.7.1",
]

[project.scripts]
tekton-scraper = "tekton_scraper.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
