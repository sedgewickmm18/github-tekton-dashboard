name: Scrape Tekton Pipeline and Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-spa/package.json'

      - name: Run Tekton Scraper (SQLite mode)
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
          PIPELINE_ID: ${{ secrets.PIPELINE_ID }}
          REGION: ${{ secrets.REGION || 'us-south' }}
          TRIGGER_NAME: ${{ secrets.TRIGGER_NAME || 'pr-trigger' }}
          REPO_GITHUB_TOKEN: ${{ secrets.REPO_GITHUB_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_PAT || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_URL: ${{ secrets.PIPELINE_URL }}
          GITHUB_REPO_URL: ${{ secrets.GITHUB_REPO_URL }}
          TEKTON_BACKEND: sqlite
          TEKTON_SQLITE_PATH: ${{ github.workspace }}/web-spa/public/dashboard.db
        run: |
          mkdir -p web-spa/public
          cd scraper
          uv run python -m tekton_scraper.main

      - name: Install web-spa dependencies and build
        run: |
          cd web-spa
          npm ci || npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web-spa/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
